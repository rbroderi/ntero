name: Create release

on:
  workflow_dispatch:
    inputs:
      label:
        description: Release label matching the project version, for example 2026.8.18
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.label }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    env:
      RELEASE_LABEL: ${{ inputs.label }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release label
        shell: pwsh
        run: |
          $versionMatch = [regex]::Match($env:RELEASE_LABEL, '^(\d{4})\.(\d{1,2})\.(\d{1,2})(?:\.(\d{1,2}))?$')
          if (-not $versionMatch.Success) {
            throw "Release label '$env:RELEASE_LABEL' is not a calendar version"
          }

          $pythonVersion = (Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"$').Matches.Groups[1].Value
          $rustVersion = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"$').Matches.Groups[1].Value
          $revision = if ($versionMatch.Groups[4].Success) { [int]$versionMatch.Groups[4].Value } else { 0 }
          $cargoPatch = ([int]$versionMatch.Groups[3].Value * 100) + $revision
          $expectedRustVersion = "$($versionMatch.Groups[1].Value).$($versionMatch.Groups[2].Value).$cargoPatch"

          if ($env:RELEASE_LABEL -ne $pythonVersion -or $expectedRustVersion -ne $rustVersion) {
            throw "Release label '$env:RELEASE_LABEL' requires Python '$env:RELEASE_LABEL' and Rust '$expectedRustVersion'; found Python '$pythonVersion' and Rust '$rustVersion'"
          }

          $existingTag = git ls-remote --tags origin "refs/tags/$env:RELEASE_LABEL"
          if ($existingTag) {
            throw "Tag '$env:RELEASE_LABEL' already exists"
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install Python dependencies
        run: uv sync --frozen --extra build

      - name: Run Python tests
        timeout-minutes: 10
        run: uv run pytest -vv --durations=20

      - name: Run Rust tests
        timeout-minutes: 10
        run: cargo test --all-targets --locked

      - name: Build executable
        run: |
          cargo build --release --locked
          uv run pyinstaller --clean --noconfirm build.spec

      - name: Smoke test executable
        run: .\dist\ntero.exe --help

      - name: Create source archive
        shell: pwsh
        run: |
          $archive = "dist/ntero-$env:RELEASE_LABEL-source.zip"
          git archive --format=zip --prefix="ntero-$env:RELEASE_LABEL/" --output=$archive HEAD

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.label }}
          name: NTERO ${{ inputs.label }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/ntero.exe
            dist/ntero-${{ inputs.label }}-source.zip