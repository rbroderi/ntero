[package]
name = "ntero-native"
version = "2026.8.25"
edition = "2024"
rust-version = "1.88"
description = "Native texture encoder for NTERO"
license = "GPL-3.0-only"
readme = "readme.md"
include = [
	"/Cargo.lock",
	"/Cargo.toml",
	"/LICENSE",
	"/ThirdPartyLicenses/**",
	"/build.rs",
	"/build.spec",
	"/CHANGELOG.md",
	"/justfile",
	"/migrate_sound_packs.py",
	"/pyproject.toml",
	"/readme.md",
	"/rust/**",
	"/src/ntero/**/*.py",
	"/src/ntero/**/*.pyi",
	"/src/ntero/py.typed",
	"/tests/**/*.py",
	"/typings/**/*.pyi",
]

[lib]
name = "_native"
path = "rust/lib.rs"
crate-type = ["cdylib"]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["bmp", "png", "tga"] }
pyo3 = { version = "0.29.2", features = ["extension-module"] }
rayon = "1.11.0"
squish = { version = "2.0.0-beta1", features = ["rayon"] }
